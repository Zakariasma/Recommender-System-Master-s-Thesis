apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "recsys.fullname" . }}-backend
  labels:
    {{- include "recsys.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "recsys.selectorLabels" . | nindent 6 }}
      app: recsys-backend
  template:
    metadata:
      labels:
        {{- include "recsys.selectorLabels" . | nindent 8 }}
        app: recsys-backend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # --- DÉCLARATION DU VOLUME ---
      {{- if .Values.backend.persistence.enabled }}
      volumes:
        - name: mdp-data
          persistentVolumeClaim:
            claimName: {{ include "recsys.fullname" . }}-backend-data
      {{- end }}
      # ------------------------------

      # --- INIT CONTAINER (Exécuté avant FastAPI) ---
      initContainers:
        - name: bootstrap-db
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["python", "-m", "chap_5.api.mdp.dataset.init_dataset"]
          envFrom:
            - configMapRef:
                name: {{ include "recsys.fullname" . }}-config
            - secretRef:
                name: {{ include "recsys.fullname" . }}-secrets
          {{- if .Values.backend.persistence.enabled }}
          volumeMounts:
            - name: mdp-data
              mountPath: {{ .Values.backend.persistence.mountPath }}
          {{- end }}
      # -----------------------------------------------

      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "recsys.fullname" . }}-config
            - secretRef:
                name: {{ include "recsys.fullname" . }}-secrets
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
              protocol: TCP
          {{- with .Values.backend.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.backend.persistence.enabled }}
          volumeMounts:
            - name: mdp-data
              mountPath: {{ .Values.backend.persistence.mountPath }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "recsys.fullname" . }}-backend
  labels:
    {{- include "recsys.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: recsys-backend

---
# --- CRÉATION DU PVC ---
{{- if .Values.backend.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "recsys.fullname" . }}-backend-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "recsys.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.backend.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.backend.persistence.size }}
{{- end }}