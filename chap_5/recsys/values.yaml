replicaCount: 1
imagePullSecrets:
- name: registry-pull-secret
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ''
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
backend:
  image:
    repository: registry.lizaine.com/series-api
    pullPolicy: Always
    tag: latest
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1500m
      memory: 4Gi
  persistence:
    enabled: true
    storageClass: local-path
    size: 15Gi
    mountPath: /app/chap_5/api/mdp/data
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
frontend:
  image:
    repository: registry.lizaine.com/series-front
    pullPolicy: Always
    tag: latest
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: traefik
    annotations:
      kubernetes.io/ingress.class: traefik
      cert-manager.io/cluster-issuer: letsencrypt-prod
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
      traefik.ingress.kubernetes.io/router.tls: 'true'
      traefik.ingress.kubernetes.io/router.middlewares: default-redirect-https@kubernetescrd
    hosts:
    - host: recsys.lizaine.com
      paths:
      - path: /
        pathType: Prefix
    tls:
    - hosts:
      - recsys.lizaine.com
      secretName: recsys-lizaine-tls
postgresql:
  enabled: true
  name: recsys-postgres
  instances: 1
  postgresql:
    enableSuperuserAccess: true
  parameters:
    max_connections: '50'
  resources:
    requests:
      cpu: 256m
      memory: 256Mi
    limits:
      cpu: 512m
      memory: 512Mi
  volume:
    size: 5Gi
    storageClass: local-path
  nodePort:
    enabled: true
    port: 30435
env:
  public:
    DB_HOST: recsys-postgres-rw
    DB_PORT: '5432'
    DB_NAME: master
    DB_USER: postgres
    BOOTSTRAP: 'True'
    CORS_ORIGINS: https://recsys.lizaine.com,http://localhost:8080
  private:
    KAGGLE_USERNAME: 
    KAGGLE_API_TOKEN: 
    POSTGRES_PASSWORD: 
    DB_PASSWORD: 
