services:
  db:
    image: postgres:18-alpine
    container_name: recsys-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-master}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5


  init-db:
    container_name: recsys-init-db
    build:
      context: ..
      dockerfile: chap_5/api/Dockerfile
    env_file:
      - .env
    command: ["python", "-m", "chap_5.api.mdp.boostrap"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    container_name: recsys-backend-container
    restart: unless-stopped
    env_file:
      - .env
    build:
      context: ..
      dockerfile: chap_5/api/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      init-db:
        condition: service_completed_successfully

  frontend:
    container_name: recsys-frontend-container
    restart: unless-stopped
    build:
      context: ./front
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data: